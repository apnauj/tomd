[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomd"
version = "0.1.3"
description = "Local wrapper around MarkItDown: convert documents, images and audio to Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Juan Pablo Alzate" }]
keywords = ["markdown", "markitdown", "pdf", "docx", "conversion"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "markitdown>=0.1.2",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
tomd = "tomd.cli:app"

[dependency-groups]
dev = [
    # The extras are a test-time need: without them the pdf/docx/xlsx converters
    # raise MissingDependencyException and the suite would not exercise a real
    # conversion. At runtime they arrive through `uv tool install --with`.
    "markitdown[all]>=0.1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    # starlette.testclient deprecated plain httpx in favour of httpx2.
    "httpx2>=0.28",
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tomd"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "T20",  # flake8-print
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "RUF",
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D107",  # __init__ documented in the class docstring
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; printing is the CLI's job.
"tests/*" = ["D100", "D103", "D104", "ANN401"]
"src/tomd/cli.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # starlette.testclient reaches a deprecated anyio alias while being imported.
    # Matched by exact message so every other DeprecationWarning stays fatal.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # pydub, reached through markitdown's audio support, warns at import time on
    # any machine without ffmpeg. Turning that into an error made every single
    # conversion fail on the CI runners, because convert() catches everything.
    # Audio conversion is the only feature that actually needs ffmpeg, and no
    # test converts audio.
    "ignore:Couldn't find ffmpeg or avconv:RuntimeWarning",
]

[tool.coverage.run]
source = ["tomd"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

# numpy reaches us transitively (markitdown -> magika -> numpy) and its stubs use
# syntax that is invalid under python_version 3.11. We never touch numpy
# ourselves, so mypy is told not to follow the import instead of relaxing any
# check on tomd's own code.
[[tool.mypy.overrides]]
module = ["numpy.*", "magika.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
